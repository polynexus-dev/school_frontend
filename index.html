<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Auth tokens live in localStorage (see src/services/api.jsx), which is
      readable by any script that runs on this page — this CSP's main job is
      making sure only this app's own bundled script can run at all, so an
      injected/third-party <script> can't read that storage in the first
      place. connect-src is left open because the API origin is set per
      deployment via VITE_API_URL at build time, not known here; tighten it
      to the real API host at the hosting/reverse-proxy layer once that's
      fixed for a given deployment.
    -->
    <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests; default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src *; object-src 'none'; base-uri 'self'; frame-ancestors 'self';" />
    <title>VIDYAM School Edition</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
